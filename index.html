    // State Variables
    let currentBatch = 0; // 0 to 9 (10 batches)
    const BATCH_SIZE = 10;
    const userAnswers = {}; // key: questionIndex, value: selectedOptionIndex

    // DOM Elements
    const batchButtonsContainer = document.getElementById('batch-buttons');
    const questionsContainer = document.getElementById('questions-container');
    const scoreDisplay = document.getElementById('score-display');
    const accuracyDisplay = document.getElementById('accuracy-display');
    const batchProgress = document.getElementById('batch-progress');
    const currentBatchIndicator = document.getElementById('current-batch-indicator');
    const prevBatchBtn = document.getElementById('prev-batch-btn');
    const nextBatchBtn = document.getElementById('next-batch-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Initialize Batches
    function renderBatchButtons() {
      batchButtonsContainer.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const btn = document.createElement('button');
        btn.textContent = `Batch ${i + 1}`;
        btn.className = `py-2 px-2 text-xs font-semibold rounded-lg border transition ${
          i === currentBatch 
            ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
            : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
        }`;
        btn.addEventListener('click', () => {
          currentBatch = i;
          renderBatch();
        });
        batchButtonsContainer.appendChild(btn);
      }
    }

    // Render 10 questions for current batch
    function renderBatch() {
      renderBatchButtons();
      currentBatchIndicator.textContent = `Batch ${currentBatch + 1} of 10 (Q#${currentBatch * BATCH_SIZE + 1} - Q#${(currentBatch + 1) * BATCH_SIZE})`;
      prevBatchBtn.disabled = (currentBatch === 0);
      nextBatchBtn.disabled = (currentBatch === 9);

      const startIndex = currentBatch * BATCH_SIZE;
      const batchItems = questionsData.slice(startIndex, startIndex + BATCH_SIZE);

      questionsContainer.innerHTML = '';

      batchItems.forEach((item, bIndex) => {
        const qIndex = startIndex + bIndex;
        const isAnswered = userAnswers.hasOwnProperty(qIndex);
        const selectedOpt = userAnswers[qIndex];

        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm";

        // Title and question text
        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded">
              Question ${qIndex + 1} / 100 &bull; Ref # ${item.id}
            </span>
            ${isAnswered ? `
              <span class="text-xs font-semibold ${selectedOpt === item.ans ? 'text-green-600' : 'text-rose-600'}">
                <i class="fa-solid ${selectedOpt === item.ans ? 'fa-check-circle' : 'fa-circle-xmark'}"></i>
                ${selectedOpt === item.ans ? 'Correct' : 'Incorrect'}
              </span>
            ` : '<span class="text-xs text-slate-400">Unanswered</span>'}
          </div>
          <p class="text-slate-800 text-sm md:text-base font-medium mb-4 whitespace-pre-line leading-relaxed">
            ${item.q}
          </p>
          <div class="space-y-2 options-container" data-qindex="${qIndex}">
            <!-- Options rendered below -->
          </div>
          <!-- Justification Container -->
          <div class="justification-box mt-4 p-4 rounded-lg bg-slate-50 border border-slate-200 text-xs md:text-sm text-slate-700 ${isAnswered ? '' : 'hidden'}">
            <div class="font-bold text-slate-800 mb-1 flex items-center gap-1.5">
              <i class="fa-solid fa-lightbulb text-amber-500"></i> Explanation:
            </div>
            <p>${item.exp}</p>
          </div>
        `;

        const optContainer = card.querySelector('.options-container');

        item.options.forEach((optText, optIdx) => {
          const optLetter = String.fromCharCode(65 + optIdx);
          const optBtn = document.createElement('button');
          optBtn.className = `option-btn w-full text-left p-3 rounded-lg border text-sm flex items-start gap-3 ${
            isAnswered ? 'cursor-default' : 'hover:bg-slate-50 border-slate-200'
          }`;

          if (isAnswered) {
            if (optIdx === item.ans) {
              optBtn.className += ' bg-green-50 border-green-500 text-green-900 font-medium';
            } else if (optIdx === selectedOpt) {
              optBtn.className += ' bg-rose-50 border-rose-500 text-rose-900';
            } else {
              optBtn.className += ' opacity-50 border-slate-200';
            }
          }

          optBtn.innerHTML = `
            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border border-current font-bold text-xs shrink-0 mt-0.5">
              ${optLetter}
            </span>
            <span class="flex-1">${optText}</span>
          `;

          if (!isAnswered) {
            optBtn.addEventListener('click', () => handleOptionClick(qIndex, optIdx));
          }

          optContainer.appendChild(optBtn);
        });

        questionsContainer.appendChild(card);
      });

      updateScoreboard();
    }

    // Handle user selection
    function handleOptionClick(qIndex, optIdx) {
      if (userAnswers.hasOwnProperty(qIndex)) return;
      userAnswers[qIndex] = optIdx;
      renderBatch();
    }

    // Update Scores
    function updateScoreboard() {
      const answeredKeys = Object.keys(userAnswers);
      const totalAnswered = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (userAnswers[k] === questionsData[k].ans) {
          correctCount++;
        }
      });

      scoreDisplay.textContent = `${correctCount} / ${totalAnswered}`;
      const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
      accuracyDisplay.textContent = `${accuracy}%`;

      // Batch specific progress
      const batchStartIndex = currentBatch * BATCH_SIZE;
      let batchAnswered = 0;
      for (let i = batchStartIndex; i < batchStartIndex + BATCH_SIZE; i++) {
        if (userAnswers.hasOwnProperty(i)) batchAnswered++;
      }
      batchProgress.textContent = `Progress: ${batchAnswered} / 10 answered`;
    }

    // Event Listeners for Nav
    prevBatchBtn.addEventListener('click', () => {
      if (currentBatch > 0) {
        currentBatch--;
        renderBatch();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBatchBtn.addEventListener('click', () => {
      if (currentBatch < 9) {
        currentBatch++;
        renderBatch();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to reset your score and progress?')) {
        for (const prop of Object.keys(userAnswers)) {
          delete userAnswers[prop];
        }
        currentBatch = 0;
        renderBatch();
      }
    });

    // Initial render
    renderBatch();
  </script>
